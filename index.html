<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Khalid | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          colors: {
            current: 'currentColor',
            transparent: 'transparent',
            black: '#000000',
            white: '#ffffff',
            red: { 500: '#ff0000', 800: '#ff0000' },
            green: { 500: '#00ff00', 800: '#00ff00' },
            blue: { 500: '#0000ff', 800: '#0000ff', 900: '#0000ff' },
            yellow: { 400: '#ffff00', 500: '#ffff00' },
            gray: {
              100: '#ffffff', 200: '#ffffff', 300: '#ffffff', 400: '#ffffff', 500: '#ffffff',
              600: '#000000', 700: '#000000', 800: '#000000', 900: '#000000'
            },
            emerald: { 500: '#00ff00' },
            purple: { 800: '#0000ff' },
            'dark-bg': '#000000',
            'dark-panel': '#000000',
            'dark-border': '#ffffff',
            'accent-teal': '#0000ff',
            'accent-emerald': '#00ff00',
            'accent-pink': '#ff0000',
            'accent-indigo': '#ffff00',
            'text-dark': '#000000',
            'text-light': '#ffffff',
          },
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-out': 'fadeOut 0.5s ease-in forwards',
              'pulse-neon': 'pulseNeon 2s infinite ease-in-out',
              'flow-line': 'flowLine 4s infinite linear',
              'float': 'float 6s infinite ease-in-out',
              'bounce-slow': 'bounce 3s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(15px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              pulseNeon: {
                '0%, 100%': { opacity: '0.4', filter: 'drop-shadow(0 0 2px rgba(255, 255, 0, 0.5))' },
                '50%': { opacity: '1', filter: 'drop-shadow(0 0 10px rgba(255, 255, 0, 0.8))' },
              },
              flowLine: {
                '0%': { strokeDashoffset: '100% ' },
                '100%': { strokeDashoffset: '0%' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        overflow-y: auto;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #ffffff;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffffff;
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(255, 255, 0, 0.15);
      }
      .neon-text-teal {
        text-shadow: 0 0 8px rgba(0, 0, 255, 0.5);
      }
      .neon-text-pink {
        text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
      }
      /* Animation styles */
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .animate-dash {
        stroke-dasharray: 8 4;
        animation: dash 2s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
