<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Khalid | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            colors: {
              'dark-bg': '#202124',
              'dark-panel': '#292a2d',
              'dark-border': '#5F6368',
              'accent-teal': '#4285F4',    /* Google Blue */
              'accent-emerald': '#34A853', /* Google Green */
              'accent-pink': '#EA4335',    /* Google Red */
              'accent-indigo': '#FBBC05',  /* Google Yellow */
              'text-dark': '#202124',
              'text-light': '#F8F9FA',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-out': 'fadeOut 0.5s ease-in forwards',
              'pulse-neon': 'pulseNeon 2s infinite ease-in-out',
              'flow-line': 'flowLine 4s infinite linear',
              'float': 'float 6s infinite ease-in-out',
              'bounce-slow': 'bounce 3s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(15px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              pulseNeon: {
                '0%, 100%': { opacity: '0.4', filter: 'drop-shadow(0 0 2px rgba(66, 133, 244, 0.5))' }, /* Google Blue */
                '50%': { opacity: '1', filter: 'drop-shadow(0 0 10px rgba(66, 133, 244, 0.8))' },
              },
              flowLine: {
                '0%': { strokeDashoffset: '100% ' },
                '100%': { strokeDashoffset: '0%' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #202124;
        color: #F8F9FA;
        overflow-y: auto;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #202124;
      }
      ::-webkit-scrollbar-thumb {
        background: #5F6368;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9AA0A6;
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(66, 133, 244, 0.15); /* Google Blue */
      }
      .neon-text-teal {
        text-shadow: 0 0 8px rgba(66, 133, 244, 0.5); /* Google Blue */
      }
      .neon-text-pink {
        text-shadow: 0 0 8px rgba(234, 67, 53, 0.5); /* Google Red */
      }
      /* Animation styles */
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .animate-dash {
        stroke-dasharray: 8 4;
        animation: dash 2s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
